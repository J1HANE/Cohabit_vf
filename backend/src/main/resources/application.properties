spring.application.name=cohabit
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:8889/cohabit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
logging.level.org.springframework.security=INFO
cohabit.auth.secret=${COHABIT_AUTH_SECRET:cohabit-local-development-secret-change-me}
cohabit.mail.enabled=${COHABIT_MAIL_ENABLED:false}
cohabit.mail.from=${COHABIT_MAIL_FROM:no-reply@cohabit.local}
cohabit.app.url=${COHABIT_APP_URL:http://localhost:5173}
spring.mail.host=${COHABIT_MAIL_HOST:}
spring.mail.port=${COHABIT_MAIL_PORT:587}
spring.mail.username=${COHABIT_MAIL_USERNAME:}
spring.mail.password=${COHABIT_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${COHABIT_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${COHABIT_MAIL_STARTTLS:true}
cohabit.admin.email=${COHABIT_ADMIN_EMAIL:}
cohabit.admin.password=${COHABIT_ADMIN_PASSWORD:}
